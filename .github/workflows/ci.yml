name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Mill
      run: |
        curl -L https://github.com/com-lihaoyi/mill/releases/download/1.0.6/1.0.6 -o mill
        chmod +x mill
        sudo mv mill /usr/local/bin/mill

    - name: Cache Mill
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill
          ~/.mill
          out
        key: ${{ runner.os }}-mill-${{ hashFiles('build.sc') }}
        restore-keys: |
          ${{ runner.os }}-mill-

    - name: Run tests
      run: mill __.test

    - name: Compile all modules
      run: mill __.compile
