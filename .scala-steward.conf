# Scala Steward configuration for ScalaSQL
# See https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Check for updates weekly
pullRequests.frequency = "7 days"

# Group patch updates together to reduce PR noise
pullRequests.grouping = [
  {
    name = "patches"
    title = "Update patch versions"
    filter = [{"version" = "patch"}]
  }
]

# Update existing PRs automatically if dependencies change
updatePullRequests = "always"

# Custom commit message prefix
commits.message = "chore: update ${artifactName} to ${nextVersion}"

# Build tool: Mill
buildRoots = [ "." ]
